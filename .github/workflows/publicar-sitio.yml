name: Publicar el sitio en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 13_SITE/quartz/package-lock.json

      - name: Instalar Quartz
        working-directory: 13_SITE/quartz
        run: npm ci --no-audit --no-fund

      - name: Enlazar los componentes propios
        working-directory: 13_SITE/quartz
        # Quartz instala cada plugin de carpeta enlazándolo en `.quartz/plugins`.
        # En Windows ese symlink exige privilegios (por eso aquí se usa un
        # junction, `mklink /J`, que no los necesita); en Linux/macOS un symlink
        # normal basta. Se crea aquí para que el build no dependa de que alguien
        # lo haya hecho a mano en su equipo.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .quartz/plugins
          for p in ficha-fuente panel-avance anotaciones; do
            rm -rf ".quartz/plugins/$p"
            ln -s "../../quartz-plugins/$p" ".quartz/plugins/$p"
            mkdir -p "quartz-plugins/$p/node_modules"
            rm -rf "quartz-plugins/$p/node_modules/preact"
            ln -s "../../../node_modules/preact" "quartz-plugins/$p/node_modules/preact"
          done
          ls -l .quartz/plugins

      - name: Construir el sitio
        working-directory: 13_SITE/quartz
        # Se invoca el CLI con `node` en vez de `npx quartz`: en Windows el bit
        # de ejecución no se propaga por git (core.filemode=false), y `npx` con
        # un binario sin permiso puede acabar resolviendo el paquete "quartz"
        # del registro de npm, que no es este proyecto.
        run: node ./quartz/bootstrap-cli.mjs build -d ../../12_VAULT -o public

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: 13_SITE/quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
